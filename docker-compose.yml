services:
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-5287}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=raizes_nordeste;Username=postgres;Password=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}"
      Jwt__Key: "${JWT_KEY:?Configure JWT_KEY no .env}"
      Demo__Seed: "true"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: raizes_nordeste
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d raizes_nordeste"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
