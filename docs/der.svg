<text x="476" y="848" class="field">FK BranchId / ProductId</text>
<text x="476" y="873" class="field">UK (BranchId, ProductId)</text>
<text x="476" y="898" class="field">Quantity &gt;= 0</text>
<text x="476" y="923" class="field">Version : concorrência</text>
<rect x="880" y="755" width="320" height="230" rx="8" fill="white" stroke="#b7cbd9"/>
<path d="M888 755 H1192 Q1200 755 1200 763 V795 H880 V763 Q880 755 888 755" fill="#173e58"/>
<text x="896" y="782" font-family="Arial" font-size="18" font-weight="bold" fill="white">OrderItems</text>
<text x="896" y="823" class="field">PK Id : GUID</text>
<text x="896" y="848" class="field">FK OrderId / ProductId</text>
<text x="896" y="873" class="field">Quantity / UnitPrice</text>
<text x="896" y="898" class="field">IsReward</text>
<text x="40" y="1090" class="field">PK: chave primária · FK: chave estrangeira · UK: restrição de unicidade</text>
<text x="40" y="1120" class="field">Setas: entidade referenciada → dependente. Pedido com ≥1 item é validado pela aplicação.</text>
<text x="40" y="1148" class="field">Auditoria não armazena senha/token; saldos e regras são protegidos por transação e validação.</text>
