<text x="56" y="848" class="field">Name / Description / Price</text>
<text x="56" y="873" class="field">LoyaltyEligible / Active</text>
<rect x="460" y="755" width="320" height="230" rx="8" fill="white" stroke="#b7cbd9"/>
