name: API - build e testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger 'trx;LogFileName=api-tests.trx' --results-directory TestResults
      - run: dotnet publish RaizesDoNordeste.API/RaizesDoNordeste.API.csproj -c Release --no-build -o artifacts/api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-testes
          path: TestResults/*.trx
